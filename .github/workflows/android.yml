name: Build Fit Tracker app
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the APK'
        required: true
        type: boolean
        default: false
      version_name:
        description: 'App version for the GitHub Release (used only when publish_release is true)'
        required: false
        type: string
        default: '3.0.0'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        # Use the Node.js 24-based action releases to avoid future runtime warnings.
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Apply release version
        if: inputs.publish_release == true
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version_name: $VERSION_NAME. Use a value such as 2.1.0 or 2.1.0-beta1."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%[-+]*}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i -E "s/private const val APP_VERSION = \"[^\"]+\"/private const val APP_VERSION = \"$VERSION_NAME\"/" app/src/main/java/com/fittracker/app/MainActivity.kt
          echo "Building release version $VERSION_NAME (versionCode $VERSION_CODE) across Gradle and app source"
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fit-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Fit Tracker v${{ inputs.version_name }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/debug/app-debug.apk
