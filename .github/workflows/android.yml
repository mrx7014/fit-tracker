name: Release Fit Tracker

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with a signed APK'
        required: true
        type: boolean
        default: false
      version_name:
        description: 'Semantic version, used only for manual releases when no tag is pushed'
        required: false
        type: string
        default: '3.0.0'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    env:
      RELEASE_REQUESTED: ${{ github.event_name == 'push' || inputs.publish_release == true }}
      TAG_VERSION: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Resolve release version from tag
        if: env.RELEASE_REQUESTED == 'true'
        run: |
          VERSION_NAME="${TAG_VERSION#v}"
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then VERSION_NAME="$INPUT_VERSION"; fi
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION_NAME"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%[-+]*}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i -E "s/private const val APP_VERSION = \"[^\"]+\"/private const val APP_VERSION = \"$VERSION_NAME\"/" app/src/main/java/com/fittracker/app/MainActivity.kt
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Prepare release signing configuration
        if: env.RELEASE_REQUESTED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are required: RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > fit-tracker-release.jks
          cat > keystore.properties <<EOF
          storeFile=fit-tracker-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Assemble debug APK
        if: env.RELEASE_REQUESTED != 'true'
        run: ./gradlew assembleDebug
      - name: Assemble signed release APK
        if: env.RELEASE_REQUESTED == 'true'
        run: ./gradlew assembleRelease
      - name: Upload debug artifact
        if: env.RELEASE_REQUESTED != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fit-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: env.RELEASE_REQUESTED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Fit Tracker v${{ env.VERSION_NAME }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
